<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escuela de Barberos — Panel</title>
<style>
  :root {
    --verde-900: #0F2A1E;
    --verde-800: #1B3B2E;
    --verde-600: #2E5C46;
    --dorado-500: #C9A876;
    --dorado-700: #A9834F;
    --crema-50: #F6F2E9;
    --blanco: #FFFFFF;
    --tinta-900: #1E2420;
    --tinta-600: #5B645D;
    --divisor: #E1DACB;
    --azul: #90CAF9;
    --verde-promo: #A5D6A7;
    --naranja: #FFCC80;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--crema-50);
    color: var(--tinta-900);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  h1, h2 { font-family: Georgia, "Times New Roman", serif; margin: 0; }

  .oculto { display: none !important; }

  /* --- Login --- */
  #login-view {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .tarjeta-login {
    background: var(--blanco);
    border-radius: 14px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 16px rgba(15, 42, 30, 0.12);
  }

  .tarjeta-login h1 {
    color: var(--verde-800);
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
  }

  .subtitulo {
    text-align: center;
    color: var(--tinta-600);
    font-size: 13px;
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--tinta-600);
    margin-bottom: 4px;
    margin-top: 14px;
  }

  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--divisor);
    border-radius: 8px;
    font-size: 15px;
    background: var(--crema-50);
    color: var(--tinta-900);
  }

  input:focus { outline: 2px solid var(--verde-600); }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }

  .btn-primario {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--verde-800);
    color: var(--blanco);
  }

  .btn-primario:active { background: var(--verde-900); }

  #login-error {
    color: #B3402A;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
    min-height: 16px;
  }

  /* --- App --- */
  header {
    background: var(--verde-800);
    color: var(--blanco);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  header h1 { font-size: 18px; }

  #btn-logout {
    background: transparent;
    color: var(--dorado-500);
    font-size: 13px;
    padding: 6px 10px;
  }

  nav.tabs {
    display: flex;
    overflow-x: auto;
    background: var(--verde-900);
  }

  .tab-btn {
    flex: 1;
    padding: 12px 8px;
    background: transparent;
    color: var(--green-200, #BFD8C9);
    font-size: 13px;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
  }

  .tab-btn.activo {
    color: var(--blanco);
    border-bottom: 3px solid var(--dorado-500);
  }

  main { padding: 16px; padding-bottom: 40px; max-width: 720px; margin: 0 auto; }

  .tab-panel { display: none; }
  .tab-panel.activo { display: block; }

  .resumen {
    background: var(--verde-800);
    color: var(--blanco);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 15px;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .buscador {
    margin-bottom: 14px;
  }

  .tarjeta {
    background: var(--blanco);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid var(--divisor);
  }

  .fila-superior {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }

  .fila-superior strong { font-size: 15px; }

  .monto {
    font-family: Georgia, serif;
    font-weight: 700;
    color: var(--verde-800);
    white-space: nowrap;
  }

  .detalle { font-size: 13px; color: var(--tinta-600); margin-top: 3px; }
  .detalle-chico { font-size: 12px; color: var(--tinta-600); margin-top: 2px; }

  .chip-inactivo {
    font-size: 11px;
    background: var(--divisor);
    color: var(--tinta-600);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .vacio {
    text-align: center;
    color: var(--tinta-600);
    padding: 30px 10px;
    font-size: 14px;
  }
</style>
</head>
<body>

  <div id="login-view">
    <form class="tarjeta-login" id="login-form">
      <h1>Escuela de Barberos</h1>
      <div class="subtitulo">Panel de revisión — inicia sesión</div>
      <label for="email">Correo</label>
      <input type="email" id="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="btn-primario">Entrar</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="app-view" class="oculto">
    <header>
      <h1>Escuela de Barberos</h1>
      <button id="btn-logout">Cerrar sesión</button>
    </header>

    <nav class="tabs">
      <button class="tab-btn activo" data-tab="ventas">Ventas</button>
      <button class="tab-btn" data-tab="pagos">Pagos</button>
      <button class="tab-btn" data-tab="alumnos">Alumnos</button>
      <button class="tab-btn" data-tab="limpieza">Limpieza</button>
    </nav>

    <main>
      <section id="tab-ventas" class="tab-panel activo">
        <div class="resumen" id="ventas-resumen">Cargando…</div>
        <div id="ventas-lista"></div>
      </section>

      <section id="tab-pagos" class="tab-panel">
        <div class="resumen" id="pagos-resumen">Cargando…</div>
        <div id="pagos-lista"></div>
      </section>

      <section id="tab-alumnos" class="tab-panel">
        <div class="buscador">
          <input type="text" id="alumnos-buscar" placeholder="Buscar alumno…">
        </div>
        <div id="alumnos-lista"></div>
      </section>

      <section id="tab-limpieza" class="tab-panel">
        <div id="limpieza-lista"></div>
      </section>
    </main>
  </div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
  import {
    getFirestore, collection, query, orderBy, limit, onSnapshot
  } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAqLnM-Ms-i0MekDxsuAayd3-Pjj1l5QXU",
    authDomain: "escuela-de-barberos.firebaseapp.com",
    projectId: "escuela-de-barberos",
    storageBucket: "escuela-de-barberos.firebasestorage.app",
    messagingSenderId: "782271875378",
    appId: "1:782271875378:web:4107af3e4c02e9fa1c6f2b",
    measurementId: "G-6YLJQYRE8N"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);

  const money = (n) => (n || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
  const fechaHora = (ms) => new Date(ms).toLocaleString('es-MX', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fechaIso = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
  };
  const esHoy = (ms) => new Date(ms).toDateString() === new Date().toDateString();

  function escapar(texto) {
    const div = document.createElement('div');
    div.textContent = texto ?? '';
    return div.innerHTML;
  }

  function tarjeta(htmlInterno) {
    const div = document.createElement('div');
    div.className = 'tarjeta';
    div.innerHTML = htmlInterno;
    return div;
  }

  function vacio(mensaje) {
    const div = document.createElement('div');
    div.className = 'vacio';
    div.textContent = mensaje;
    return div;
  }

  // --- Login ---
  $('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    $('login-error').textContent = '';
    signInWithEmailAndPassword(auth, $('email').value.trim(), $('password').value)
      .catch(() => { $('login-error').textContent = 'Correo o contraseña incorrectos.'; });
  });

  $('btn-logout').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    $('login-view').classList.toggle('oculto', !!user);
    $('app-view').classList.toggle('oculto', !user);
    if (user) iniciarEscuchas();
  });

  // --- Tabs ---
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('activo'));
      document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('activo'));
      btn.classList.add('activo');
      $('tab-' + btn.dataset.tab).classList.add('activo');
    });
  });

  // --- Datos en memoria (para cruzar colecciones) ---
  let cursos = {};
  let alumnos = {};
  let ventasCache = [];
  let pagosCache = [];
  let limpiezaCache = [];

  let escuchasIniciadas = false;
  function iniciarEscuchas() {
    if (escuchasIniciadas) return;
    escuchasIniciadas = true;

    onSnapshot(collection(db, 'cursos'), (snap) => {
      cursos = {};
      snap.forEach((d) => (cursos[d.id] = d.data()));
      renderAlumnos();
    });

    onSnapshot(query(collection(db, 'alumnos'), orderBy('nombreCompleto')), (snap) => {
      alumnos = {};
      snap.forEach((d) => (alumnos[d.id] = d.data()));
      renderAlumnos();
      renderPagos();
    });

    onSnapshot(query(collection(db, 'ventas'), orderBy('fechaHora', 'desc'), limit(100)), (snap) => {
      ventasCache = [];
      snap.forEach((d) => ventasCache.push(d.data()));
      renderVentas();
    });

    onSnapshot(query(collection(db, 'pagos'), orderBy('fechaHora', 'desc'), limit(200)), (snap) => {
      pagosCache = [];
      snap.forEach((d) => pagosCache.push(d.data()));
      renderPagos();
    });

    onSnapshot(query(collection(db, 'limpieza'), orderBy('fecha', 'desc'), limit(30)), (snap) => {
      limpiezaCache = [];
      snap.forEach((d) => limpiezaCache.push(d.data()));
      renderLimpieza();
    });
  }

  function renderVentas() {
    const hoy = ventasCache.filter((v) => esHoy(v.fechaHora));
    const total = hoy.reduce((acc, v) => acc + v.total, 0);
    $('ventas-resumen').textContent = `Hoy: ${money(total)} (${hoy.length} venta${hoy.length === 1 ? '' : 's'})`;

    const cont = $('ventas-lista');
    cont.innerHTML = '';
    if (ventasCache.length === 0) { cont.appendChild(vacio('Aún no hay ventas registradas.')); return; }

    ventasCache.forEach((v) => {
      const detalle = (v.detalles || []).map((d) => `${d.cantidad}x ${d.nombreProducto}`).join(', ');
      cont.appendChild(tarjeta(`
        <div class="fila-superior">
          <strong>${fechaHora(v.fechaHora)}</strong>
          <span class="monto">${money(v.total)}</span>
        </div>
        <div class="detalle">${escapar(v.metodoPago)} · Cobró: ${escapar(v.nombreRecepcionista)}</div>
        ${detalle ? `<div class="detalle-chico">${escapar(detalle)}</div>` : ''}
      `));
    });
  }

  function renderPagos() {
    const hoy = pagosCache.filter((p) => esHoy(p.fechaHora));
    const total = hoy.reduce((acc, p) => acc + p.monto, 0);
    $('pagos-resumen').textContent = `Hoy: ${money(total)}`;

    const grupos = new Map();
    pagosCache.forEach((p) => {
      const clave = p.grupoPagoId ?? p.id;
      if (!grupos.has(clave)) grupos.set(clave, []);
      grupos.get(clave).push(p);
    });

    const cont = $('pagos-lista');
    cont.innerHTML = '';
    if (grupos.size === 0) { cont.appendChild(vacio('Aún no hay pagos registrados.')); return; }

    grupos.forEach((filas) => {
      const primera = filas[0];
      const total = filas.reduce((acc, p) => acc + p.monto, 0);
      const alumno = alumnos[primera.alumnoId];
      const nombre = alumno ? alumno.nombreCompleto : '(alumno eliminado)';
      cont.appendChild(tarjeta(`
        <div class="fila-superior">
          <strong>${escapar(nombre)}</strong>
          <span class="monto">${money(total)}</span>
        </div>
        <div class="detalle">${fechaHora(primera.fechaHora)} · ${escapar(primera.metodoPago)}${primera.tipoPlan ? ' · ' + escapar(primera.tipoPlan) : ''}</div>
      `));
    });
  }

  function renderAlumnos() {
    const filtro = $('alumnos-buscar').value.trim().toLowerCase();
    const lista = Object.values(alumnos).filter((a) => a.nombreCompleto.toLowerCase().includes(filtro));

    const cont = $('alumnos-lista');
    cont.innerHTML = '';
    if (lista.length === 0) { cont.appendChild(vacio('No se encontraron alumnos.')); return; }

    lista.forEach((a) => {
      const curso = a.cursoId != null ? cursos[a.cursoId] : null;
      cont.appendChild(tarjeta(`
        <div class="fila-superior">
          <strong>${escapar(a.nombreCompleto)}</strong>
          ${a.activo === false ? '<span class="chip-inactivo">Inactivo</span>' : ''}
        </div>
        <div class="detalle">${escapar(a.telefono || '—')}${curso ? ' · ' + escapar(curso.nombre) : ''}</div>
        ${a.planPago ? `<div class="detalle-chico">Plan: ${escapar(a.planPago)}</div>` : ''}
      `));
    });
  }
  $('alumnos-buscar').addEventListener('input', renderAlumnos);

  function renderLimpieza() {
    const cont = $('limpieza-lista');
    cont.innerHTML = '';
    if (limpiezaCache.length === 0) { cont.appendChild(vacio('Aún no hay registros de limpieza.')); return; }

    const tareas = ['barrer', 'trapear', 'limpiarPuertas', 'limpiarVidrios', 'limpiarEspejos', 'limpiarRecepcion'];
    limpiezaCache.forEach((r) => {
      const completadas = tareas.filter((k) => r[k]).length;
      cont.appendChild(tarjeta(`
        <div class="fila-superior">
          <strong>${fechaIso(r.fecha)} · ${escapar(r.turno)}</strong>
          <span class="monto">${completadas}/${tareas.length}</span>
        </div>
        <div class="detalle">Responsable: ${escapar(r.responsable)}</div>
        ${r.tareasExtra ? `<div class="detalle-chico">Extra: ${escapar(r.tareasExtra)}</div>` : ''}
        ${r.notas ? `<div class="detalle-chico">${escapar(r.notas)}</div>` : ''}
      `));
    });
  }
</script>
</body>
</html>
