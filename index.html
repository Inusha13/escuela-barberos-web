<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escuela de Barberos — Panel</title>
<style>
  :root {
    --verde-900: #0F2A1E;
    --verde-800: #1B3B2E;
    --verde-600: #2E5C46;
    --dorado-500: #C9A876;
    --dorado-700: #A9834F;
    --crema-50: #F6F2E9;
    --blanco: #FFFFFF;
    --tinta-900: #1E2420;
    --tinta-600: #5B645D;
    --divisor: #E1DACB;
    --azul: #90CAF9;
    --verde-promo: #A5D6A7;
    --naranja: #FFCC80;
    --rojo: #B33A3A;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--crema-50);
    color: var(--tinta-900);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  h1, h2 { font-family: Georgia, "Times New Roman", serif; margin: 0; }

  .oculto { display: none !important; }

  /* --- Login --- */
  #login-view {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .tarjeta-login {
    background: var(--blanco);
    border-radius: 14px;
    padding: 32px 28px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 4px 16px rgba(15, 42, 30, 0.12);
  }

  .tarjeta-login h1 {
    color: var(--verde-800);
    font-size: 22px;
    text-align: center;
    margin-bottom: 6px;
  }

  .subtitulo {
    text-align: center;
    color: var(--tinta-600);
    font-size: 13px;
    margin-bottom: 22px;
  }

  label {
    display: block;
    font-size: 13px;
    color: var(--tinta-600);
    margin-bottom: 4px;
    margin-top: 14px;
  }

  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    padding: 11px 12px;
    border: 1px solid var(--divisor);
    border-radius: 8px;
    font-size: 15px;
    background: var(--crema-50);
    color: var(--tinta-900);
  }

  input:focus { outline: 2px solid var(--verde-600); }

  button {
    cursor: pointer;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
  }

  .btn-primario {
    width: 100%;
    margin-top: 20px;
    padding: 12px;
    background: var(--verde-800);
    color: var(--blanco);
  }

  .btn-primario:active { background: var(--verde-900); }

  #login-error {
    color: #B3402A;
    font-size: 13px;
    margin-top: 12px;
    text-align: center;
    min-height: 16px;
  }

  /* --- App --- */
  header {
    background: var(--verde-800);
    color: var(--blanco);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  header h1 { font-size: 18px; }

  #btn-logout {
    background: transparent;
    color: var(--dorado-500);
    font-size: 13px;
    padding: 6px 10px;
  }

  nav.tabs {
    display: flex;
    overflow-x: auto;
    background: var(--verde-900);
  }

  .tab-btn {
    flex: 1;
    padding: 12px 8px;
    background: transparent;
    color: var(--green-200, #BFD8C9);
    font-size: 13px;
    white-space: nowrap;
    border-bottom: 3px solid transparent;
  }

  .tab-btn.activo {
    color: var(--blanco);
    border-bottom: 3px solid var(--dorado-500);
  }

  main { padding: 16px; padding-bottom: 40px; max-width: 720px; margin: 0 auto; }

  .tab-panel { display: none; }
  .tab-panel.activo { display: block; }

  .resumen {
    background: var(--verde-800);
    color: var(--blanco);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 15px;
    margin-bottom: 16px;
    font-weight: 600;
  }

  .buscador {
    margin-bottom: 14px;
  }

  .filtro-fecha {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    margin-bottom: 14px;
  }

  .filtro-fecha input[type="date"] {
    flex: 1;
    min-width: 130px;
    padding: 9px 10px;
    border: 1px solid var(--divisor);
    border-radius: 8px;
    font-size: 13px;
    background: var(--blanco);
    color: var(--tinta-900);
  }

  .btn-chico {
    padding: 9px 14px;
    font-size: 13px;
    background: var(--verde-800);
    color: var(--blanco);
  }

  .btn-chico.secundario {
    background: transparent;
    color: var(--verde-800);
    border: 1px solid var(--verde-800);
  }

  .tarjeta {
    background: var(--blanco);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    border: 1px solid var(--divisor);
  }

  .fila-superior {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 10px;
  }

  .fila-superior strong { font-size: 15px; }

  .monto {
    font-family: Georgia, serif;
    font-weight: 700;
    color: var(--verde-800);
    white-space: nowrap;
  }

  .detalle { font-size: 13px; color: var(--tinta-600); margin-top: 3px; }
  .detalle-chico { font-size: 12px; color: var(--tinta-600); margin-top: 2px; }

  .fila-acciones {
    display: flex;
    justify-content: flex-end;
    margin-top: 6px;
  }

  .btn-borrar {
    border: none;
    background: transparent;
    color: var(--rojo);
    font-size: 12px;
    padding: 4px 2px;
    cursor: pointer;
  }
  .btn-borrar:hover { text-decoration: underline; }

  .chip-inactivo {
    font-size: 11px;
    background: var(--divisor);
    color: var(--tinta-600);
    padding: 2px 8px;
    border-radius: 20px;
  }

  .vacio {
    text-align: center;
    color: var(--tinta-600);
    padding: 30px 10px;
    font-size: 14px;
  }

  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 42, 30, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
  }

  .modal-caja {
    background: var(--blanco);
    border-radius: 14px;
    padding: 20px;
    max-width: 420px;
    width: 100%;
    max-height: 80vh;
    overflow-y: auto;
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    margin-bottom: 14px;
  }

  .modal-cuerpo {
    white-space: pre-wrap;
    font-size: 14px;
    color: var(--tinta-900);
    margin-bottom: 18px;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <div id="login-view">
    <form class="tarjeta-login" id="login-form">
      <h1>Escuela de Barberos</h1>
      <div class="subtitulo">Panel de revisión — inicia sesión</div>
      <label for="email">Usuario</label>
      <input type="text" id="email" required autocomplete="username">
      <label for="password">Contraseña</label>
      <input type="password" id="password" required autocomplete="current-password">
      <button type="submit" class="btn-primario">Entrar</button>
      <div id="login-error"></div>
    </form>
  </div>

  <div id="app-view" class="oculto">
    <header>
      <h1>Escuela de Barberos</h1>
      <button id="btn-logout">Cerrar sesión</button>
    </header>

    <nav class="tabs">
      <button class="tab-btn activo" data-tab="ventas">Ventas</button>
      <button class="tab-btn" data-tab="pagos">Pagos</button>
      <button class="tab-btn" data-tab="alumnos">Alumnos</button>
      <button class="tab-btn" data-tab="limpieza">Limpieza</button>
      <button class="tab-btn" data-tab="maestro">Maestro</button>
    </nav>

    <main>
      <section id="tab-ventas" class="tab-panel activo">
        <div class="filtro-fecha">
          <input type="date" id="ventas-desde">
          <input type="date" id="ventas-hasta">
          <button type="button" class="btn-chico" id="ventas-buscar">Buscar</button>
          <button type="button" class="btn-chico secundario oculto" id="ventas-limpiar">Ver recientes</button>
        </div>
        <div class="resumen" id="ventas-resumen">Cargando…</div>
        <div id="ventas-lista"></div>
      </section>

      <section id="tab-pagos" class="tab-panel">
        <div class="filtro-fecha">
          <input type="date" id="pagos-desde">
          <input type="date" id="pagos-hasta">
          <button type="button" class="btn-chico" id="pagos-buscar">Buscar</button>
          <button type="button" class="btn-chico secundario oculto" id="pagos-limpiar">Ver recientes</button>
        </div>
        <div class="resumen" id="pagos-resumen">Cargando…</div>
        <div id="pagos-lista"></div>
      </section>

      <section id="tab-alumnos" class="tab-panel">
        <div class="buscador">
          <input type="text" id="alumnos-buscar" placeholder="Buscar por nombre o por curso…">
        </div>
        <div id="alumnos-lista"></div>
      </section>

      <section id="tab-limpieza" class="tab-panel">
        <div class="filtro-fecha">
          <input type="date" id="limpieza-desde">
          <input type="date" id="limpieza-hasta">
          <button type="button" class="btn-chico" id="limpieza-buscar">Buscar</button>
          <button type="button" class="btn-chico secundario oculto" id="limpieza-limpiar">Ver recientes</button>
        </div>
        <div id="limpieza-lista"></div>
      </section>

      <section id="tab-maestro" class="tab-panel">
        <div id="maestro-lista"></div>
      </section>
    </main>
  </div>

  <div id="modal-overlay" class="modal-overlay oculto">
    <div class="modal-caja">
      <div class="modal-header">
        <strong id="modal-titulo"></strong>
        <button type="button" class="btn-chico secundario" id="modal-cerrar">Cerrar</button>
      </div>
      <div class="modal-cuerpo" id="modal-cuerpo"></div>
      <button type="button" class="btn-primario" id="modal-compartir" style="margin-top: 0;">Compartir por WhatsApp</button>
    </div>
  </div>

  <div id="confirmar-overlay" class="modal-overlay oculto">
    <div class="modal-caja">
      <div class="modal-header">
        <strong>Confirmar</strong>
      </div>
      <div class="modal-cuerpo" id="confirmar-mensaje"></div>
      <div style="display: flex; gap: 10px;">
        <button type="button" class="btn-chico secundario" id="confirmar-cancelar" style="flex: 1;">Cancelar</button>
        <button type="button" class="btn-chico" id="confirmar-aceptar" style="flex: 1; background: var(--rojo);">Borrar</button>
      </div>
    </div>
  </div>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js';
  import {
    getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
  } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js';
  import {
    getFirestore, collection, query, where, orderBy, limit, onSnapshot, getDocs, doc, deleteDoc, writeBatch
  } from 'https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyAqLnM-Ms-i0MekDxsuAayd3-Pjj1l5QXU",
    authDomain: "escuela-de-barberos.firebaseapp.com",
    projectId: "escuela-de-barberos",
    storageBucket: "escuela-de-barberos.firebasestorage.app",
    messagingSenderId: "782271875378",
    appId: "1:782271875378:web:4107af3e4c02e9fa1c6f2b",
    measurementId: "G-6YLJQYRE8N"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const $ = (id) => document.getElementById(id);

  const money = (n) => (n || 0).toLocaleString('es-MX', { style: 'currency', currency: 'MXN' });
  const fechaHora = (ms) => new Date(ms).toLocaleString('es-MX', { day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' });
  const fechaIso = (iso) => {
    const [y, m, d] = iso.split('-').map(Number);
    return new Date(y, m - 1, d).toLocaleDateString('es-MX', { day: 'numeric', month: 'short', year: 'numeric' });
  };
  const esHoy = (ms) => new Date(ms).toDateString() === new Date().toDateString();
  const etiquetaRango = (desdeStr, hastaStr) =>
    desdeStr === hastaStr ? fechaIso(desdeStr) : `${fechaIso(desdeStr)} al ${fechaIso(hastaStr)}`;

  function escapar(texto) {
    const div = document.createElement('div');
    div.textContent = texto ?? '';
    return div.innerHTML;
  }

  function tarjeta(htmlInterno) {
    const div = document.createElement('div');
    div.className = 'tarjeta';
    div.innerHTML = htmlInterno;
    return div;
  }

  function vacio(mensaje) {
    const div = document.createElement('div');
    div.className = 'vacio';
    div.textContent = mensaje;
    return div;
  }

  function botonBorrar(onBorrar) {
    const cont = document.createElement('div');
    cont.className = 'fila-acciones';
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'btn-borrar';
    btn.textContent = 'Borrar';
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      onBorrar();
    });
    cont.appendChild(btn);
    return cont;
  }

  function confirmarPersonalizado(mensaje) {
    return new Promise((resolve) => {
      $('confirmar-mensaje').textContent = mensaje;
      $('confirmar-overlay').classList.remove('oculto');

      const limpiar = () => {
        $('confirmar-overlay').classList.add('oculto');
        $('confirmar-aceptar').removeEventListener('click', onAceptar);
        $('confirmar-cancelar').removeEventListener('click', onCancelar);
        $('confirmar-overlay').removeEventListener('click', onFondo);
      };
      const onAceptar = () => { limpiar(); resolve(true); };
      const onCancelar = () => { limpiar(); resolve(false); };
      const onFondo = (e) => { if (e.target.id === 'confirmar-overlay') onCancelar(); };

      $('confirmar-aceptar').addEventListener('click', onAceptar);
      $('confirmar-cancelar').addEventListener('click', onCancelar);
      $('confirmar-overlay').addEventListener('click', onFondo);
    });
  }

  async function borrarDoc(coleccion, id, mensaje) {
    if (!(await confirmarPersonalizado(mensaje))) return;
    try {
      await deleteDoc(doc(db, coleccion, id));
    } catch (e) {
      alert('No se pudo borrar. Revisa tu conexión e intenta de nuevo.');
    }
  }

  async function borrarVarios(coleccion, ids, mensaje) {
    if (!(await confirmarPersonalizado(mensaje))) return;
    try {
      const lote = writeBatch(db);
      ids.forEach((id) => lote.delete(doc(db, coleccion, id)));
      await lote.commit();
    } catch (e) {
      alert('No se pudo borrar. Revisa tu conexión e intenta de nuevo.');
    }
  }

  // --- Login ---
  // El login pide solo un nombre de usuario corto; por dentro Firebase sigue necesitando
  // un correo, así que si no escriben uno (sin "@") se le agrega un dominio interno fijo.
  const DOMINIO_USUARIO = 'escueladebarberos.local';
  const aCorreoInterno = (usuario) => {
    const valor = usuario.trim();
    return valor.includes('@') ? valor : `${valor.toLowerCase()}@${DOMINIO_USUARIO}`;
  };

  $('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    $('login-error').textContent = '';
    signInWithEmailAndPassword(auth, aCorreoInterno($('email').value), $('password').value)
      .catch(() => { $('login-error').textContent = 'Usuario o contraseña incorrectos.'; });
  });

  $('btn-logout').addEventListener('click', () => signOut(auth));

  onAuthStateChanged(auth, (user) => {
    $('login-view').classList.toggle('oculto', !!user);
    $('app-view').classList.toggle('oculto', !user);
    if (user) iniciarEscuchas();
  });

  // --- Tabs ---
  document.querySelectorAll('.tab-btn').forEach((btn) => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('activo'));
      document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('activo'));
      btn.classList.add('activo');
      $('tab-' + btn.dataset.tab).classList.add('activo');
    });
  });

  // --- Datos en memoria (para cruzar colecciones) ---
  let cursos = {};
  let alumnos = {};
  let ventasCache = [];
  let pagosCache = [];
  let limpiezaCache = [];
  let liquidacionesCache = [];

  let unsubVentas = null, rangoVentas = null;
  function cargarVentas(desdeMs, hastaMs, etiqueta) {
    if (unsubVentas) unsubVentas();
    rangoVentas = etiqueta || null;
    const q = desdeMs != null
      ? query(collection(db, 'ventas'), where('fechaHora', '>=', desdeMs), where('fechaHora', '<=', hastaMs), orderBy('fechaHora', 'desc'))
      : query(collection(db, 'ventas'), orderBy('fechaHora', 'desc'), limit(100));
    unsubVentas = onSnapshot(q, (snap) => {
      ventasCache = [];
      snap.forEach((d) => ventasCache.push(d.data()));
      renderVentas();
    });
  }

  let unsubPagos = null, rangoPagos = null;
  function cargarPagos(desdeMs, hastaMs, etiqueta) {
    if (unsubPagos) unsubPagos();
    rangoPagos = etiqueta || null;
    const q = desdeMs != null
      ? query(collection(db, 'pagos'), where('fechaHora', '>=', desdeMs), where('fechaHora', '<=', hastaMs), orderBy('fechaHora', 'desc'))
      : query(collection(db, 'pagos'), orderBy('fechaHora', 'desc'), limit(200));
    unsubPagos = onSnapshot(q, (snap) => {
      pagosCache = [];
      snap.forEach((d) => pagosCache.push(d.data()));
      renderPagos();
    });
  }

  let unsubLimpieza = null, rangoLimpieza = null;
  function cargarLimpieza(desdeIso, hastaIso, etiqueta) {
    if (unsubLimpieza) unsubLimpieza();
    rangoLimpieza = etiqueta || null;
    const q = desdeIso
      ? query(collection(db, 'limpieza'), where('fecha', '>=', desdeIso), where('fecha', '<=', hastaIso), orderBy('fecha', 'desc'))
      : query(collection(db, 'limpieza'), orderBy('fecha', 'desc'), limit(30));
    unsubLimpieza = onSnapshot(q, (snap) => {
      limpiezaCache = [];
      snap.forEach((d) => limpiezaCache.push(d.data()));
      renderLimpieza();
    });
  }

  function configurarFiltroFecha(prefijo, alBuscar, alLimpiar) {
    const desde = $(`${prefijo}-desde`);
    const hasta = $(`${prefijo}-hasta`);
    const btnBuscar = $(`${prefijo}-buscar`);
    const btnLimpiar = $(`${prefijo}-limpiar`);

    btnBuscar.addEventListener('click', () => {
      if (!desde.value || !hasta.value) return;
      alBuscar(desde.value, hasta.value);
      btnLimpiar.classList.remove('oculto');
    });

    btnLimpiar.addEventListener('click', () => {
      desde.value = '';
      hasta.value = '';
      alLimpiar();
      btnLimpiar.classList.add('oculto');
    });
  }

  function rangoAMillis(desdeStr, hastaStr) {
    return [new Date(desdeStr + 'T00:00:00').getTime(), new Date(hastaStr + 'T23:59:59.999').getTime()];
  }

  configurarFiltroFecha('ventas', (desdeStr, hastaStr) => {
    const [inicio, fin] = rangoAMillis(desdeStr, hastaStr);
    cargarVentas(inicio, fin, etiquetaRango(desdeStr, hastaStr));
  }, () => cargarVentas(null, null, null));

  configurarFiltroFecha('pagos', (desdeStr, hastaStr) => {
    const [inicio, fin] = rangoAMillis(desdeStr, hastaStr);
    cargarPagos(inicio, fin, etiquetaRango(desdeStr, hastaStr));
  }, () => cargarPagos(null, null, null));

  configurarFiltroFecha('limpieza', (desdeStr, hastaStr) => {
    cargarLimpieza(desdeStr, hastaStr, etiquetaRango(desdeStr, hastaStr));
  }, () => cargarLimpieza(null, null, null));

  let escuchasIniciadas = false;
  function iniciarEscuchas() {
    if (escuchasIniciadas) return;
    escuchasIniciadas = true;

    onSnapshot(collection(db, 'cursos'), (snap) => {
      cursos = {};
      snap.forEach((d) => (cursos[d.id] = d.data()));
      renderAlumnos();
    });

    onSnapshot(query(collection(db, 'alumnos'), orderBy('nombreCompleto')), (snap) => {
      alumnos = {};
      snap.forEach((d) => (alumnos[d.id] = d.data()));
      renderAlumnos();
      renderPagos();
    });

    cargarVentas(null, null, null);
    cargarPagos(null, null, null);
    cargarLimpieza(null, null, null);

    onSnapshot(query(collection(db, 'liquidaciones_maestro'), orderBy('fechaLiquidacion', 'desc'), limit(50)), (snap) => {
      liquidacionesCache = [];
      snap.forEach((d) => liquidacionesCache.push(d.data()));
      renderMaestro();
    });
  }

  const etiquetaSemanasLiquidacion = (l) =>
    l.semanaDesde === l.semanaHasta ? `Semana ${l.semanaDesde}` : `Semanas ${l.semanaDesde} a ${l.semanaHasta}`;

  function renderMaestro() {
    const cont = $('maestro-lista');
    cont.innerHTML = '';
    if (liquidacionesCache.length === 0) {
      cont.appendChild(vacio('Aún no se ha registrado ningún pago al maestro.'));
      return;
    }

    liquidacionesCache.forEach((l) => {
      const t = tarjeta(`
        <div class="fila-superior">
          <strong>${escapar(l.cursoNombre)}</strong>
          <span class="monto">${money(l.totalComision)}</span>
        </div>
        <div class="detalle">${fechaHora(l.fechaLiquidacion)} · ${etiquetaSemanasLiquidacion(l)}</div>
        <div class="detalle-chico">${money(l.totalPagos)} en pagos · ${l.cantidadPagos} pagos · ${l.cantidadAlumnos} alumnos</div>
      `);
      t.style.cursor = 'pointer';
      t.addEventListener('click', () => mostrarDetalleLiquidacion(l));
      t.appendChild(botonBorrar(() =>
        borrarDoc('liquidaciones_maestro', String(l.id), `¿Borrar este pago al maestro de ${money(l.totalComision)}? Esto no vuelve a marcar los pagos como pendientes de liquidar en la tablet. No se puede deshacer.`)
      ));
      cont.appendChild(t);
    });
  }

  async function mostrarDetalleLiquidacion(liquidacion) {
    const snap = await getDocs(query(collection(db, 'pagos'), where('liquidacionId', '==', liquidacion.id)));
    const porAlumno = new Map();
    snap.forEach((d) => {
      const p = d.data();
      if (!porAlumno.has(p.alumnoId)) porAlumno.set(p.alumnoId, []);
      porAlumno.get(p.alumnoId).push(p);
    });

    const filas = [...porAlumno.entries()]
      .map(([alumnoId, pagosDelAlumno]) => ({
        nombre: alumnos[alumnoId]?.nombreCompleto || '(alumno eliminado)',
        monto: pagosDelAlumno.reduce((acc, p) => acc + p.monto, 0),
        semanas: pagosDelAlumno.length
      }))
      .sort((a, b) => a.nombre.localeCompare(b.nombre));

    const rango = etiquetaSemanasLiquidacion(liquidacion);
    const lineasTexto = filas
      .map((f) => `• ${f.nombre} — ${money(f.monto)} (${f.semanas === 1 ? '1 semana' : f.semanas + ' semanas'})`)
      .join('\n');

    $('modal-titulo').textContent = fechaHora(liquidacion.fechaLiquidacion);
    $('modal-cuerpo').textContent =
      `${liquidacion.cursoNombre} · ${rango}\n\nComisión pagada: ${money(liquidacion.totalComision)}\n\nPor alumno:\n${lineasTexto}`;
    $('modal-overlay').classList.remove('oculto');

    const comprobante =
      `Escuela de Barberos — Comprobante de pago al maestro\n` +
      `${fechaHora(liquidacion.fechaLiquidacion)}\n` +
      `${liquidacion.cursoNombre} · ${rango}\n\n` +
      `Total de pagos: ${money(liquidacion.totalPagos)}\n` +
      `Comisión pagada: ${money(liquidacion.totalComision)}\n\n` +
      `Por alumno:\n${lineasTexto}`;
    $('modal-compartir').onclick = () => compartirTexto(comprobante);
  }

  async function compartirTexto(texto) {
    if (navigator.share) {
      try { await navigator.share({ text: texto }); } catch (e) { /* el usuario canceló */ }
      return;
    }
    try {
      await navigator.clipboard.writeText(texto);
      alert('Se copió el comprobante. Pégalo en WhatsApp o donde lo necesites.');
    } catch (e) {
      alert('No se pudo compartir automáticamente. Copia el texto manualmente.');
    }
  }

  $('modal-cerrar').addEventListener('click', () => $('modal-overlay').classList.add('oculto'));
  $('modal-overlay').addEventListener('click', (e) => {
    if (e.target.id === 'modal-overlay') $('modal-overlay').classList.add('oculto');
  });

  function renderVentas() {
    const base = rangoVentas ? ventasCache : ventasCache.filter((v) => esHoy(v.fechaHora));
    const etiqueta = rangoVentas || 'Hoy';
    const total = base.reduce((acc, v) => acc + v.total, 0);
    $('ventas-resumen').textContent = `${etiqueta}: ${money(total)} (${base.length} venta${base.length === 1 ? '' : 's'})`;

    const cont = $('ventas-lista');
    cont.innerHTML = '';
    if (ventasCache.length === 0) {
      cont.appendChild(vacio(rangoVentas ? 'No hay ventas en ese rango.' : 'Aún no hay ventas registradas.'));
      return;
    }

    ventasCache.forEach((v) => {
      const detalle = (v.detalles || []).map((d) => `${d.cantidad}x ${d.nombreProducto}`).join(', ');
      const t = tarjeta(`
        <div class="fila-superior">
          <strong>${fechaHora(v.fechaHora)}</strong>
          <span class="monto">${money(v.total)}</span>
        </div>
        <div class="detalle">${escapar(v.metodoPago)} · Cobró: ${escapar(v.nombreRecepcionista)}</div>
        ${detalle ? `<div class="detalle-chico">${escapar(detalle)}</div>` : ''}
      `);
      t.appendChild(botonBorrar(() =>
        borrarDoc('ventas', String(v.id), `¿Borrar la venta de ${money(v.total)} del ${fechaHora(v.fechaHora)}? No se puede deshacer.`)
      ));
      cont.appendChild(t);
    });
  }

  function renderPagos() {
    const base = rangoPagos ? pagosCache : pagosCache.filter((p) => esHoy(p.fechaHora));
    const etiqueta = rangoPagos || 'Hoy';
    const total = base.reduce((acc, p) => acc + p.monto, 0);
    $('pagos-resumen').textContent = `${etiqueta}: ${money(total)}`;

    const grupos = new Map();
    pagosCache.forEach((p) => {
      const clave = p.grupoPagoId ?? p.id;
      if (!grupos.has(clave)) grupos.set(clave, []);
      grupos.get(clave).push(p);
    });

    const cont = $('pagos-lista');
    cont.innerHTML = '';
    if (grupos.size === 0) {
      cont.appendChild(vacio(rangoPagos ? 'No hay pagos en ese rango.' : 'Aún no hay pagos registrados.'));
      return;
    }

    grupos.forEach((filas) => {
      const primera = filas[0];
      const total = filas.reduce((acc, p) => acc + p.monto, 0);
      const alumno = alumnos[primera.alumnoId];
      const nombre = alumno ? alumno.nombreCompleto : '(alumno eliminado)';
      const t = tarjeta(`
        <div class="fila-superior">
          <strong>${escapar(nombre)}</strong>
          <span class="monto">${money(total)}</span>
        </div>
        <div class="detalle">${fechaHora(primera.fechaHora)} · ${escapar(primera.metodoPago)}${primera.tipoPlan ? ' · ' + escapar(primera.tipoPlan) : ''}</div>
      `);
      const yaLiquidado = filas.some((p) => p.pagadoAlMaestro);
      t.appendChild(botonBorrar(() => {
        const advertencia = yaLiquidado ? '\n\nOjo: este pago ya está incluido en un pago al maestro registrado.' : '';
        borrarVarios('pagos', filas.map((p) => String(p.id)), `¿Borrar el pago de ${nombre} por ${money(total)}? No se puede deshacer.${advertencia}`);
      }));
      cont.appendChild(t);
    });
  }

  const normalizarBusqueda = (texto) =>
    (texto || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();

  function renderAlumnos() {
    const filtro = normalizarBusqueda($('alumnos-buscar').value.trim());
    const lista = Object.values(alumnos).filter((a) => {
      if (!filtro) return true;
      const nombreCurso = a.cursoId != null ? (cursos[a.cursoId]?.nombre || '') : '';
      return normalizarBusqueda(a.nombreCompleto).includes(filtro) || normalizarBusqueda(nombreCurso).includes(filtro);
    });

    const cont = $('alumnos-lista');
    cont.innerHTML = '';
    if (lista.length === 0) { cont.appendChild(vacio('No se encontraron alumnos.')); return; }

    lista.forEach((a) => {
      const curso = a.cursoId != null ? cursos[a.cursoId] : null;
      cont.appendChild(tarjeta(`
        <div class="fila-superior">
          <strong>${escapar(a.nombreCompleto)}</strong>
          ${a.activo === false ? '<span class="chip-inactivo">Inactivo</span>' : ''}
        </div>
        <div class="detalle">${escapar(a.telefono || '—')}${curso ? ' · ' + escapar(curso.nombre) : ''}</div>
        ${a.planPago ? `<div class="detalle-chico">Plan: ${escapar(a.planPago)}</div>` : ''}
      `));
    });
  }
  $('alumnos-buscar').addEventListener('input', renderAlumnos);

  function renderLimpieza() {
    const cont = $('limpieza-lista');
    cont.innerHTML = '';
    if (limpiezaCache.length === 0) {
      cont.appendChild(vacio(rangoLimpieza ? 'No hay registros en ese rango.' : 'Aún no hay registros de limpieza.'));
      return;
    }

    const tareas = ['barrer', 'trapear', 'limpiarPuertas', 'limpiarVidrios', 'limpiarEspejos', 'limpiarRecepcion'];
    limpiezaCache.forEach((r) => {
      const completadas = tareas.filter((k) => r[k]).length;
      const t = tarjeta(`
        <div class="fila-superior">
          <strong>${fechaIso(r.fecha)} · ${escapar(r.turno)}</strong>
          <span class="monto">${completadas}/${tareas.length}</span>
        </div>
        <div class="detalle">Responsable: ${escapar(r.responsable)}</div>
        ${r.tareasExtra ? `<div class="detalle-chico">Extra: ${escapar(r.tareasExtra)}</div>` : ''}
        ${r.notas ? `<div class="detalle-chico">${escapar(r.notas)}</div>` : ''}
      `);
      t.appendChild(botonBorrar(() =>
        borrarDoc('limpieza', String(r.id), `¿Borrar el registro de limpieza del ${fechaIso(r.fecha)} (${r.turno})? No se puede deshacer.`)
      ));
      cont.appendChild(t);
    });
  }
</script>
</body>
</html>
